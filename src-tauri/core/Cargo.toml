[package]
name = "fenix-core"
version = "0.1.0"
description = "FenixCraft launcher logic without a Tauri dependency, so it can be tested on its own"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "fs", "io-util", "net", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
encoding_rs = "0.8"
dirs = "5.0"
uuid = { version = "1.10", features = ["v3", "v4"] }
zip = "9"

[dev-dependencies]
tempfile = "3"
