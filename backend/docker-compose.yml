services:
  fenixcraft-backend:
    build: .
    container_name: fenixcraft-backend
    restart: always
    ports:
      # Порт открыт только для nginx на этом же сервере.
      - "127.0.0.1:8000:8000"
    environment:
      - BASE_PUBLIC_URL=${BASE_PUBLIC_URL:-http://fenixcraft.ru/api/launcher}
      - VK_TOKEN=${VK_TOKEN:-}
      - TWITCH_CLIENT_ID=${TWITCH_CLIENT_ID:-}
      - TWITCH_CLIENT_SECRET=${TWITCH_CLIENT_SECRET:-}
      - TWITCH_CHANNEL=${TWITCH_CHANNEL:-bloodrayt}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/launcher/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    # Даже при взломе приложения контейнер не сможет менять систему и получать новые права.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      # Моды, раздаваемые игрокам, и список серверов контейнер только читает.
      - ./storage:/app/storage:ro
      - ./servers.json:/app/servers.json:ro
      # Каталог скинов и плащей (кладёт администратор) и выбор игроков.
      - ./catalog:/app/catalog:ro
      - ./data:/app/data
      # Копия установщика лаунчера: сервер скачивает её с GitHub сам.
      - ./updates:/app/updates
