name: Release FenixCraft Launcher

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Install Linux Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libssl-dev

      - name: Build and Release Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'FenixCraft Launcher ${{ github.ref_name }}'
          releaseBody: |
            ## Что нового в ${{ github.ref_name }} 🦅
            - 🎨 Обновлен главный баннер лаунчера (Minecraft Adventure).
            - 🚀 Добавлено автоматическое обновление лаунчера при выходе новых версий (OTA Auto-Updater).
            - ⚡ Мгновенная смена и сохранение никнейма в интерфейсе без перезагрузки.
            - 🛡️ Надежная авторизация и поддержка скинов.
            - ☕ Встроенный автоинсталлер Java 21/25 Adoptium Hotspot.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
