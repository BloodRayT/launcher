name: Release FenixCraft Launcher

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tauri:
    # Релиз собирается только по тегу: из ветки получился бы черновик с неверным именем.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Install Linux Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libssl-dev libdbus-1-dev

      - name: Install UI build tools
        run: npm ci

      - name: Check versions match the tag
        run: npm run check:versions

      - name: Read release notes
        id: notes
        shell: bash
        run: |
          {
            echo 'body<<FENIX_NOTES_END'
            cat RELEASE_NOTES.md
            echo
            echo 'FENIX_NOTES_END'
          } >> "$GITHUB_OUTPUT"

      - name: Build and Release Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FENIX_MS_CLIENT_ID: ${{ vars.FENIX_MS_CLIENT_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'FenixCraft Launcher ${{ github.ref_name }}'
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
