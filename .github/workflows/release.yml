name: Build FenixCraft Launcher (Tauri v2)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: '--target x86_64-pc-windows-msvc'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Build and Release Tauri v2
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v2.6.0
          releaseName: 'FenixCraft Launcher v2.6.0 (Ultra-Light)'
          releaseBody: 'Готовые сборки лаунчера FenixCraft под Windows (.exe/.msi), Linux (.AppImage/.deb) и macOS (.dmg).'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
